[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-ai"
version = "0.1.0"
description = "AI-assisted synthetic relational data generator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faker>=30,<40",
  "google-genai>=1,<2",
  "langfuse>=3,<4",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2,<3",
  "sqlglot>=25,<30",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["synthetic_data_ai"]

