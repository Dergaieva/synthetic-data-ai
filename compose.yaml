services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synthetic_data
      POSTGRES_USER: synthetic_user
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetic_user -d synthetic_data"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

